<!DOCTYPE html>
<html>
    <head>
        <link  rel="stylesheet" href="styles.css" />
        <title>Add On</title>
        <script src="index.js" type="module"></script>
    </head>

    <body>
        <h1 id="title">Welcome to Add-On!</h1>

        <div id="grid">
            <div id="counter-button-div">
                <strong>Counter</strong>

                <button id="counter-button">
                    Count
                </button>
                <button id="counter-three-button" class="hidden">
                    Count +3
                </button>
                <button id="counter-five-button" class="hidden">
                    Count +5
                </button>
                <button id="counter-ten-button" class="hidden">
                    Count +10
                </button>
                <button id="counter-hundred-button" class="hidden">
                    Count +100
                </button>
                <button id="reset-counter-button">
                    Reset
                </button>

                <p id="counter-display">Count: 0</p>
                <button id="open-shop-button">Open Item Shop</button>
                <div id="item-shop-div" class="hidden">
                    <p>Item Shop</p>

                    <button id="buy-blue-back-button">Blue background: 500</button>
                </div>
            </div>

            <div id="date-time-div">
                <strong>Date and Time</strong>
                <p id="time">Time: 00:00</p>
                <p id="date">Date: 00-00-0000</p>
            </div>
        </div>

    </body>

</html>
